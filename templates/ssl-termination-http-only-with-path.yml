http:
  routers:
    {{NAME}}-http:
      rule: {{RULE}}
      service: {{NAME}}-service
      entryPoints: [web]
      middlewares: [{{NAME}}/rx-root]
  services:
    {{NAME}}-service:
      loadBalancer:
        servers:
          - url: http://{{IP}}:{{PORT}}
  middlewares:
    {{NAME}}/rx-root:
      replacePathRegex:
        regex: '^(?:/(.*))?$'
        replacement: {{PATH_REPLACEMENT}}
